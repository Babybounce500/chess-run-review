<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="../orbitron-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../orbitron-light.css">
<title>Checkmate Library · Orbitron Chess</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<style>
:root{--bg:#181715;--panel:#262421;--panel2:#1a1917;--line:#3d3a36;--text:#bab8b5;--white:#fff;--green:#81b64c;--blue:#5b93d6;--gold:#d3a94c;--red:#c85a54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.top{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.top a{color:var(--green);font-weight:700;text-decoration:none}.top h1{margin:0;flex:1;color:#fff;font-size:1.15rem}.top small{color:#888;font-family:monospace}.shell{max-width:1220px;margin:auto;padding:18px}.intro,.selected,.panel{background:var(--panel);border-radius:10px;padding:14px}.intro{border-left:4px solid var(--blue);line-height:1.5;margin-bottom:14px}.intro b,.selected h2{color:#fff}.layout{display:grid;grid-template-columns:minmax(280px,410px) 1fr;gap:16px}.search{width:100%;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:#fff;margin-bottom:10px}.cats,.actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.cats button,.actions button{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer}.cats button.active,.cats button:hover,.actions .primary{background:var(--blue);border-color:var(--blue);color:#fff}.hint{font-size:.75rem;color:#888;margin-bottom:8px}.list{display:flex;flex-direction:column;gap:5px;max-height:68vh;overflow:auto}.item{padding:10px;background:var(--panel2);border:1px solid transparent;border-radius:7px;cursor:pointer}.item.active{border-color:var(--blue);background:#19263a}.item strong,.item span{display:block}.item strong{color:#fff}.item span{font-size:.74rem;color:#999;margin-top:2px}.item .tag{color:var(--gold);font-family:monospace}.selected{border-left:4px solid var(--blue);margin-bottom:12px}.selected h2{margin:0 0 5px;font-size:1.2rem}.meta{color:#999;line-height:1.5}.stage{display:flex;gap:14px}.board{width:min(460px,100%);aspect-ratio:1;overflow:hidden;border-radius:7px;box-shadow:0 8px 24px #0008;flex:none}.side{flex:1;min-width:220px}.moves{display:flex;flex-wrap:wrap;gap:4px;padding:9px;background:var(--panel);border-radius:7px;max-height:180px;overflow:auto}.move{font:12px monospace;padding:5px 7px;background:var(--panel2);border-radius:4px;cursor:pointer}.move.active{background:var(--blue);color:#fff}.status,.why{padding:10px;margin-top:10px;line-height:1.5;font-size:.8rem}.status{background:#1b2635;border-left:3px solid var(--blue)}.status.good{background:#1c2b1a;border-color:var(--green)}.status.bad{background:#30201f;border-color:var(--red)}.why{background:#30291c;border-left:3px solid var(--gold)}@media(max-width:850px){.layout{grid-template-columns:1fr}.stage{flex-direction:column}.board{width:min(90vw,460px);margin:auto}.list{max-height:40vh}}@media(max-width:520px){.shell{padding:10px}.top{padding:12px}.top small{display:none}}
</style>
</head>
<body>
<header class="top"><a href="../gemini-chat.html">← Orbitron Chess</a><h1>Checkmate Library</h1><small>9 geprüfte Mattbilder</small></header>
<main class="shell"><div class="intro"><b>Spielbare Mattkombinationen.</b> Starte eine feste Folge oder löse sie selbst. Im Übungsmodus akzeptiert das Brett nur den nächsten legalen Zug der ausgewählten Kombination.</div>
<div class="layout"><section class="panel"><input id="search" class="search" placeholder="Muster, Figur, Idee …"><div class="cats"><button class="active" data-cat="all">Alle</button><button data-cat="angriff">Angriff</button><button data-cat="endspiel">Endspiel</button><button data-cat="netz">Königsnetz</button></div><div id="hint" class="hint"></div><div id="list" class="list"></div></section>
<section><div id="selected" class="selected"></div><div class="stage"><div id="board" class="board"></div><div class="side"><div class="actions"><button id="play" class="primary">▶ Kombination abspielen</button><button id="practice">♟ Selbst lösen</button><button id="first">|‹</button><button id="prev">‹</button><button id="next">›</button><button id="last">›|</button><button id="flip">↕</button></div><div id="moves" class="moves"></div><div id="status" class="status"></div><div id="why" class="why"></div></div></div></section></div></main>
<script>
(()=>{const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const patterns=[
{name:"Schäfermatt",cat:"angriff",pieces:"Dame + Läufer",fen:"start",line:["e4","e5","Bc4","Nc6","Qh5","Nf6","Qxf7#"],why:"Dame und Läufer greifen gemeinsam f7 an. f7 ist am Anfang nur vom König gedeckt, deshalb ist der Schlag auf f7 sofort Matt."},
{name:"Narrenmatt",cat:"angriff",pieces:"Dame + offene Diagonale",fen:"start",line:["f3","e5","g4","Qh4#"],why:"Die Bauernzüge f3 und g4 öffnen die Diagonale h4-e1 zum weißen König. Das schnellste mögliche Matt."},
{name:"Grundreihenmatt (Turm)",cat:"netz",pieces:"Turm + Bauernwall",fen:"6k1/5ppp/8/8/8/8/6PP/4R1K1 w - - 0 1",line:["Re8#"],why:"Die eigenen Bauern f7, g7 und h7 versperren dem König die Fluchtfelder. Der Turm besetzt die Grundreihe."},
{name:"Grundreihenmatt (Dame)",cat:"netz",pieces:"Dame + Bauernwall",fen:"6k1/5ppp/8/8/8/8/5PPP/3Q2K1 w - - 0 1",line:["Qd8#"],why:"Gleiches Motiv mit der Dame: Sie schlägt auf der Grundreihe zu, der König hat hinter seinen Bauern keine Luft."},
{name:"Ersticktes Matt",cat:"netz",pieces:"Springer + eingesperrter König",fen:"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1",line:["Nf7#"],why:"Der König wird von seinem eigenen Turm und den Bauern eingeschlossen. Nur ein Springer kann Schach geben, ohne geschlagen zu werden."},
{name:"Anastasias Matt",cat:"netz",pieces:"Turm + Springer",fen:"8/4N1pk/8/8/8/8/6K1/R7 w - - 0 1",line:["Rh1#"],why:"Der Springer auf e7 nimmt g8 und g6, der eigene Bauer sperrt g7. Der Turm gibt auf der h-Linie Schach."},
{name:"Treppenmatt (zwei Türme)",cat:"endspiel",pieces:"Turm + Turm",fen:"7k/R7/1R6/8/8/8/8/6K1 w - - 0 1",line:["Rb8#"],why:"Ein Turm sperrt die siebte Reihe, der andere gibt auf der achten Reihe Matt."},
{name:"Dame und König",cat:"endspiel",pieces:"Dame + König",fen:"7k/5K2/8/8/8/8/8/6Q1 w - - 0 1",line:["Qg8#"],why:"Der König auf f7 deckt das Mattfeld g8 der Dame und nimmt dem schwarzen König g7."},
{name:"Turm und König",cat:"endspiel",pieces:"Turm + König",fen:"7k/8/6K1/8/8/8/8/R7 w - - 0 1",line:["Ra8#"],why:"Der König auf g6 nimmt g7 und h7. Der Turm sperrt die achte Reihe."}
];let selected=null,game=null,solution=[],step=0,mode='view',cat='all',flipped=false;
function makeGame(p){game=new Chess();if(p.fen!=='start')game.load(p.fen);solution=[];for(const san of p.line){const m=game.move(san,{sloppy:true});if(m)solution.push({san:m.san,uci:m.from+m.to+(m.promotion||'')})}game=new Chess();if(p.fen!=='start')game.load(p.fen);step=0}const board=Chessboard('board',{position:'start',draggable:true,onDrop:(from,to)=>drop(from,to),pieceTheme:'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'});
function pool(){const q=$('#search').value.toLowerCase().trim();return patterns.filter(p=>(cat==='all'||p.cat===cat)&&(!q||(p.name+' '+p.pieces+' '+p.why).toLowerCase().includes(q)))}function renderList(){const a=pool();$('#hint').textContent=a.length+' Muster · '+patterns.filter(p=>p.line.length).length+' mit fester Kombination';$('#list').innerHTML=a.map(p=>`<div class="item${p===selected?' active':''}" data-name="${esc(p.name)}"><strong>${esc(p.name)}</strong><span>${esc(p.pieces)}</span><span class="tag">${esc(p.cat)}${p.line.length?' · '+p.line.length+' Züge':''}</span></div>`).join('')}function renderMoves(){if(!solution.length){$('#moves').innerHTML='<span style="color:#888">Diagramm-Motiv ohne feste Zugfolge.</span>';return}$('#moves').innerHTML=solution.map((m,i)=>`<span class="move${i<step?' active':''}" data-step="${i+1}">${i+1}. ${esc(m.san)}</span>`).join('')}function redraw(){board.position(game.fen(),false);renderMoves()}function select(p){selected=p;makeGame(p);mode='view';$('#selected').innerHTML=`<h2>${esc(p.name)}</h2><div class="meta"><b>Figuren:</b> ${esc(p.pieces)}<br><b>Kategorie:</b> ${esc(p.cat)} · ${solution.length?'feste Kombination':'Erkennungsmotiv'}</div>`;$('#why').innerHTML=`<b>Was du sehen solltest:</b> ${esc(p.why)}`;$('#status').className='status';$('#status').textContent=solution.length?'Kombination abspielen oder selbst lösen.':'Hier geht es um das Erkennen des Mattnetzes.';redraw();renderList()}function goto(n){if(!selected)return;makeGame(selected);for(let i=0;i<n;i++)game.move(solution[i].san,{sloppy:true});step=n;redraw()}function play(){if(!solution.length)return;mode='view';goto(Math.min(solution.length,step+1));$('#status').className='status good';$('#status').textContent=step===solution.length?'Kombination vollständig abgespielt.':'Kombination läuft — weiter mit ›.'}function practice(){if(!solution.length){$('#status').className='status bad';$('#status').textContent='Für dieses Motiv ist keine feste Zugfolge hinterlegt.';return}mode='practice';goto(0);$('#status').className='status';$('#status').textContent='Selbst lösen: Ziehe den nächsten Zug auf dem Brett.'}function drop(from,to){if(mode!=='practice')return'snapback';const expected=solution[step],m=game.move({from,to,promotion:'q'});if(!m)return'snapback';const uci=m.from+m.to+(m.promotion||'');if(!expected||uci!==expected.uci){game.undo();$('#status').className='status bad';$('#status').textContent='Noch nicht — das ist nicht der nächste Zug der Kombination.';return'snapback'}step++;redraw();$('#status').className='status good';$('#status').textContent=step===solution.length?'Stark — Kombination gelöst!':'Richtig. Finde den nächsten Zug.';if(step===solution.length)mode='view'}$('#list').onclick=e=>{const x=e.target.closest('.item');if(x)select(patterns.find(p=>p.name===x.dataset.name))};$('#search').oninput=renderList;document.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.cats button').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('#play').onclick=play;$('#practice').onclick=practice;$('#first').onclick=()=>goto(0);$('#prev').onclick=()=>goto(Math.max(0,step-1));$('#next').onclick=()=>goto(Math.min(solution.length,step+1));$('#last').onclick=()=>goto(solution.length);$('#moves').onclick=e=>{const x=e.target.closest('.move');if(x)goto(+x.dataset.step)};$('#flip').onclick=()=>{flipped=!flipped;board.flip()};renderList();select(patterns[0])})();
</script>
</body>
</html>
