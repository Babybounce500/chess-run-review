<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schach-Musterpartien</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mute:#5d6b7a;--line:#dfe4ea;--acc:#1f6feb;--good:#1a7f4b;--bad:#c0392b;--warn:#b7791f;--lt:#f0d9b5;--dk:#b58863;--hl:rgba(255,215,0,.55)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1319;--card:#171e27;--ink:#e6ebf1;--mute:#94a3b3;--line:#27313d;--acc:#5aa2ff;--good:#3ecf8e;--bad:#ff7b72;--warn:#e3b341}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif}main{max-width:1060px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.2rem;margin:1.4em 0 .5em}h3{font-size:1rem;margin:.9em 0 .3em}.sub{color:var(--mute);margin:0 0 1em}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font:inherit;cursor:pointer}nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}.note{color:var(--mute);font-size:.85rem}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.bt{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:5px;vertical-align:middle;margin-right:6px;overflow:hidden}.bt i{display:block;height:100%}
a.go{color:var(--acc);cursor:pointer;text-decoration:underline}
.view{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:16px;align-items:start}@media(max-width:760px){.view{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);width:100%;max-width:420px}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(7.2vw,38px);line-height:1;position:relative;user-select:none}.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}.sq.h{box-shadow:inset 0 0 0 100px var(--hl)}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.pb{color:#111;text-shadow:0 0 1px rgba(255,255,255,.4)}
.ctrl{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.ctrl button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.moves{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:.92rem;max-height:200px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px}.moves span.m{cursor:pointer;padding:0 3px;border-radius:4px}.moves span.m.cur{background:var(--acc);color:#fff}.moves span.bk{color:var(--mute)}.moves .no{color:var(--mute)}
.evg{width:100%;height:110px;cursor:pointer}.list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.list button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer;text-align:left}.list button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.pz{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.pz .card{margin:0}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.75rem;color:var(--mute)}
.sol{display:none;margin-top:6px;font-size:.9rem}.sol.on{display:block}

<script>
const DATA=JSON.parse(document.getElementById('d').textContent);const PGN=document.getElementById('pgn').textContent;
const G={w:{K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'}};const files='abcdefgh';
function parse(fen){const rows=fen.split(' ')[0].split('/');const b=[];for(const r of rows){const x=[];for(const ch of r){if(/\d/.test(ch))for(let i=0;i<+ch;i++)x.push(null);else x.push(ch)}b.push(x)}return b}
function board(fen,flip,hl){const b=parse(fen);let h='<div class="board">';for(let ri=0;ri<8;ri++)for(let fi=0;fi<8;fi++){const r=flip?7-ri:ri,f=flip?7-fi:fi;const p=b[r][f];const sq=files[f]+(8-r);const light=(r+f)%2===0;const isH=hl&&(hl[0]===sq||hl[1]===sq);h+='<div class="sq '+(light?'l':'d')+(isH?' h':'')+'">'+(p?'<span class="'+(p===p.toUpperCase()?'pw':'pb')+'">'+G.w[p.toUpperCase()]+'</span>':'')+'</div>'}return h+'</div>'}
const $=s=>document.querySelector(s);let tab='check',gi=0,ply=0,play=null;
const tabs=[['check','Eröffnungs-Check'],['games','Musterpartien'],['puz','Lehrpositionen'],['rules','Mittelspiel-Regeln']];
function nav(){$('#nav').innerHTML=tabs.map(t=>'<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')}
function go(t){tab=t;stop();nav();render();window.scrollTo(0,0)}
function stop(){if(play){clearInterval(play);play=null}}
function fmt(v){if(Math.abs(v)>=9000)return v>0?'M':'-M';return (v/100>0?'+':'')+(v/100).toFixed(1)}
function pickG(id){gi=DATA.games.findIndex(g=>g.id===id);ply=DATA.games[gi].book;tab='games';nav();render()}
function render(){const a=$('#app');if(tab==='check')a.innerHTML=checkHTML();else if(tab==='games')gamesHTML();else if(tab==='puz')a.innerHTML=puzHTML();else a.innerHTML=rulesHTML()}
function checkHTML(){const rows=DATA.rows;const gm=Object.fromEntries(DATA.games.map(g=>[g.fam,g.id]));
 const mk=r=>'<tr><td>'+r.k+'</td><td class="n">'+r.g+'</td><td class="n">'+r.W+'-'+r.D+'-'+r.L+'</td><td><span class="bt"><i style="width:'+r.sc+'%;background:'+(r.sc>=60?'var(--good)':r.sc>=50?'var(--warn)':'var(--bad)')+'"></i></span>'+r.sc+' %</td><td class="n">'+r.aol+'</td><td class="n">'+r.aml+'</td><td>'+(gm[r.k]?'<a class="go" onclick="pickG(\''+gm[r.k]+'\')">Musterpartie</a>':'')+'</td></tr>';
 const th='<tr><th>Eröffnung</th><th>Partien</th><th>S-R-N</th><th>Score</th><th>Verlust Eröffnung*</th><th>Verlust Mittelspiel*</th><th></th></tr>';
 return '<div class="card"><h2 style="margin-top:0">Stark (Score ≥ 60 %)</h2><table>'+th+rows.filter(r=>r.sc>=60).map(mk).join('')+'</table></div><div class="card"><h2 style="margin-top:0">Mittelfeld (50–59 %)</h2><table>'+th+rows.filter(r=>r.sc>=50&&r.sc<60).map(mk).join('')+'</table></div><div class="card"><h2 style="margin-top:0">Schwach (unter 50 %)</h2><table>'+th+rows.filter(r=>r.sc<50).map(mk).join('')+'</table></div><p class="note">*Durchschnittlicher Centipawn-Verlust pro eigenem Zug (Zug 1–10 bzw. 11–30, gedeckelt bei 1000). Nur Eröffnungsfamilien mit mindestens 12 Partien; „Weiß: Sizilianisch“ bedeutet z. B., dass du als Weiß gegen Sizilianisch gespielt hast. Score = (Siege + ½ Remis) / Partien.</p>'}
function gamesHTML(){const g=DATA.games[gi];const a=$('#app');const cats=[...new Set(DATA.games.map(x=>x.cat))];
 let h='';for(const c of cats){h+='<div class="note" style="margin-top:8px"><b>'+c+'</b></div><div class="list">'+DATA.games.filter(x=>x.cat===c).map(x=>'<button class="'+(x.id===g.id?'on':'')+'" onclick="pickG(\''+x.id+'\')">'+x.title+'</button>').join('')+'</div>'}
 h+='<div class="card"><h2 style="margin-top:0">'+g.title+'</h2><div class="note">'+(g.user==='w'?'Du spielst Weiß':'Du spielst Schwarz')+' · Ergebnis '+g.result+' ('+g.end+') · '+g.caps+' Schlagzüge · Theorie bis Zug '+Math.ceil(g.book/2)+'</div><div class="view"><div id="bd"></div><div><div id="mv" class="moves"></div><div class="ctrl"><button onclick="step(-999)">⏮</button><button onclick="step(-1)">◀</button><button id="pb" onclick="togglePlay()">▶ Abspielen</button><button onclick="step(1)">▶</button><button onclick="step(999)">⏭</button><button onclick="dl()">PGN laden</button></div><svg id="evg" class="evg" viewBox="0 0 600 110"></svg><div class="note" id="evn"></div></div></div></div>';
 h+='<div class="card"><h3 style="margin-top:0">Idee</h3><p>'+g.idea+'</p><h3>Plan für dich</h3><p>'+g.plan+'</p>'+(g.stat?'<h3>Deine Daten</h3><p>'+g.stat.g+' Partien, '+g.stat.W+'-'+g.stat.D+'-'+g.stat.L+', Score '+g.stat.sc+' %, durchschnittlicher Verlust pro Zug: '+g.stat.aol+' cp in der Eröffnung, '+g.stat.aml+' cp im Mittelspiel.</p>':'')+'<h3>Wendepunkte der Engine-Partie</h3><p class="note">'+(g.key.length?g.key.map(k=>'<a class="go" onclick="jump('+k+')">Zug '+Math.ceil(k/2)+(k%2?'':'…')+' '+g.moves[k-1]+'</a>').join(' · '):'Keine größeren Bewertungssprünge: beide Seiten spielen praktisch fehlerfrei.')+'</p><p class="note">Hinweis: Stockfish gegen Stockfish endet fast immer remis. Wichtig sind der Aufbau, die Pläne und die Reaktion auf typische Ideen, nicht das Ergebnis.</p></div>';
 a.innerHTML=h;draw()}
function draw(){const g=DATA.games[gi];const ft=ply>0?g.ft[ply-1]:null;$('#bd').innerHTML=board(g.fens[ply],g.user==='b',ft);
 let m='';g.moves.forEach((s,i)=>{if(i%2===0)m+='<span class="no">'+(i/2+1)+'.</span>';m+='<span class="m'+(i+1===ply?' cur':'')+(i<g.book?' bk':'')+'" onclick="jump('+(i+1)+')">'+s+'</span>'});$('#mv').innerHTML=m;const c=$('#mv .cur');if(c)c.scrollIntoView({block:'nearest'});
 const n=g.ev.length,pts=g.ev.map((v,i)=>(i/(n-1)*600).toFixed(1)+','+(55-Math.max(-300,Math.min(300,v))/300*50).toFixed(1)).join(' ');
 $('#evg').innerHTML='<rect width="600" height="55" fill="rgba(26,127,75,.12)"/><rect y="55" width="600" height="55" fill="rgba(192,57,43,.12)"/><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2"/><line x1="'+(ply/(n-1)*600)+'" x2="'+(ply/(n-1)*600)+'" y1="0" y2="110" stroke="var(--ink)" stroke-width="1.5"/>'+(g.book?'<line x1="'+(g.book/(n-1)*600)+'" x2="'+(g.book/(n-1)*600)+'" y1="0" y2="110" stroke="var(--mute)" stroke-dasharray="4 3"/>':'')+g.key.map(k=>'<circle cx="'+(k/(n-1)*600)+'" cy="'+(55-Math.max(-300,Math.min(300,g.ev[k]))/300*50)+'" r="4" fill="var(--warn)"/>').join('');
 $('#evg').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();ply=Math.round((e.clientX-r.left)/r.width*(n-1));draw()};
 $('#evn').textContent='Bewertung nach Zug '+Math.ceil(ply/2)+': '+fmt(g.ev[ply])+' (Weiß-Sicht, in Bauern). Gestrichelt: Ende der Theorie, gelb: Wendepunkte.'}
function step(d){const g=DATA.games[gi];ply=Math.max(0,Math.min(g.moves.length,ply+d));draw()}function jump(k){ply=k;draw()}
function togglePlay(){if(play){stop();$('#pb').textContent='▶ Abspielen';return}$('#pb').textContent='⏸ Pause';play=setInterval(()=>{const g=DATA.games[gi];if(ply>=g.moves.length){stop();$('#pb').textContent='▶ Abspielen';return}ply++;draw()},700)}
function dl(){const g=DATA.games[gi];const parts=PGN.split(/\n\n(?=\[Event )/);const p=parts.find(x=>x.includes('[Opening "'+g.title+'"]'))||PGN;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([p],{type:'text/plain'}));a.download=g.id+'.pgn';a.click()}
function puzHTML(){const T={mate:'Matt zugelassen',missed:'Gewinn verpasst',tact:'Mittelspiel-Patzer'};let h='';for(const t of ['mate','missed','tact']){h+='<h2>'+T[t]+'</h2><div class="pz">'+DATA.puz.filter(p=>p.type===t).map((p,i)=>{const id=t+i;return '<div class="card">'+board(p.fen,!p.w,null)+'<div style="margin-top:8px"><span class="tag">'+p.date+' · '+p.tc+' · '+p.color+' · Zug '+p.move+'</span></div><p style="margin:6px 0">Du hast <b class="bad">'+p.san+'</b> gespielt (Bewertung '+fmt(p.before)+' → '+(p.after==='Matt'?'Matt':fmt(p.after))+').</p><button onclick="document.getElementById(\''+id+'\').classList.toggle(\'on\')" style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer">Lösung zeigen</button><div class="sol" id="'+id+'">Besser war <b class="good">'+p.best+'</b>'+(p.pv.length>1?' (Variante: '+p.pv.join(' ')+')':'')+'.</div></div>'}).join('')+'</div>'}return '<p class="note">Positionen aus deinen eigenen Partien (Stockfish 19, Tiefe 11–13). Brett aus deiner Sicht, Figuren in Standardstellung; die Lösung ist zugeklappt.</p>'+h}
function rulesHTML(){return '<div class="card"><h2 style="margin-top:0">Mittelspiel-Regeln aus deinen Daten</h2><ol><li><b>Dame (30 % grobe Fehler oder Patzer pro Zug) und Turm (27 %):</b> Vor jedem Zug von Dame oder Turm prüfen, welche Schlagzüge und Schachs der Gegner danach hat.</li><li><b>Grundreihe:</b> 72-mal bist du per Grundreihenmatt verloren. Schaffe früh Luft (h3 oder g3) und lass nie den einzigen Turm von der Grundreihe weglocken.</li><li><b>Springer (25 %):</b> Nur auf gedeckte Felder ziehen und Gabeln auf König und Dame prüfen. Ungedeckte Figuren sind dein häufigster Verlustgrund.</li><li><b>Zug 11–30:</b> Hier liegt deine Fehlerquote bei 27–33 %. Formuliere in jeder Stellung einen Plan (Figur verbessern, Schwäche angreifen, König sichern), bevor du einen Zug wählst.</li><li><b>Vorteil verwerten:</b> Bei ≥ +3 tauschen, eigene Bauern sichern, erst dann Schach geben. 517-mal hast du Vorteil verspielt.</li><li><b>Dranbleiben:</b> Du rettest 40 % verlorener Stellungen. Gib nie auf, spiele aber ruhige, taktisch saubere Züge.</li></ol></div><div class="card"><h3 style="margin-top:0">Checkliste vor jedem Zug (10 Sekunden)</h3><p><b>1.</b> Hat der Gegner Schach oder Matt? <b>2.</b> Welche meiner Figuren sind ungedeckt? <b>3.</b> Was droht der Gegner nach meinem Zug? <b>4.</b> Gibt es für mich Schach, Schlagzug oder Matt in 1–3?</p></div>'}
nav();render();
document.addEventListener('keydown',e=>{if(tab!=='games')return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
</script></main></body></html>
