<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mute:#5d6b7a;--line:#dfe4ea;--acc:#1f6feb;--good:#1a7f4b;--bad:#c0392b;--warn:#b7791f;--lt:#f0d9b5;--dk:#b58863;--hl:rgba(255,215,0,.55)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}.note{color:var(--mute);font-size:.85rem}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}

.bt{display:inline-block;width:70px;height:8px;background:var(--line);border-radius:5px;vertical-align:middle;margin-right:6px;overflow:hidden}.bt i{display:block;height:100%}
a.go{color:var(--acc);cursor:pointer;text-decoration:underline}
.view{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:16px;align-items:start}@media(max-width:760px){.view{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);width:100%;max-width:420px;container-type:inline-size}
.sq{display:flex;align-items:center;justify-content:center;font-size:9.5cqw;line-height:1;position:relative;user-select:none;min-width:0;min-height:0;overflow:hidden;font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols 2",sans-serif}.sq span{display:block;line-height:1;transform:translateY(-4%)}.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}.sq.h{box-shadow:inset 0 0 0 100px var(--hl)}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.pb{color:#111;text-shadow:0 0 1px rgba(255,255,255,.4)}
.ctrl{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.ctrl button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.moves{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:.92rem;max-height:200px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:8px}.moves span.m{cursor:pointer;padding:0 3px;border-radius:4px}.moves span.m.cur{background:var(--acc);color:#fff}.moves span.bk{color:var(--mute)}.moves .no{color:var(--mute)}
.evg{width:100%;height:110px;cursor:pointer}.list{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.list button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer;text-align:left}.list button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.pz{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.pz .card{margin:0}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.75rem;color:var(--mute)}
.sol{display:none;margin-top:6px;font-size:.9rem}.sol.on{display:block}.sb{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit}

const G={w:{K:'♚︎',Q:'♛︎',R:'♜︎',B:'♝︎',N:'♞︎',P:'♟︎'}};const files='abcdefgh';
function parse(fen){const rows=fen.split(' ')[0].split('/');const b=[];for(const r of rows){const x=[];for(const ch of r){if(/\d/.test(ch))for(let i=0;i<+ch;i++)x.push(null);else x.push(ch)}b.push(x)}return b}
function board(fen,flip,hl){const b=parse(fen);let h='<div class="board">';for(let ri=0;ri<8;ri++)for(let fi=0;fi<8;fi++){const r=flip?7-ri:ri,f=flip?7-fi:fi;const p=b[r][f];const sq=files[f]+(8-r);const light=(r+f)%2===0;const isH=hl&&(hl[0]===sq||hl[1]===sq);h+='<div class="sq '+(light?'l':'d')+(isH?' h':'')+'">'+(p?'<span class="'+(p===p.toUpperCase()?'pw':'pb')+'">'+G.w[p.toUpperCase()]+'</span>':'')+'</div>'}return h+'</div>'}
const $=s=>document.querySelector(s);let tab='check',gi=0,ply=0,play=null;
const tabsAll=[['check','Eröffnungs-Check'],['games','Musterpartien'],['mate','Matt &amp; Taktik'],['konter','Konterspiel'],['turnier','Computer-Turnier'],['tal','Michail Tal'],['gotham','GothamChess'],['puz','Lehrpositionen'],['rules','Mittelspiel-Regeln']];

function fmt(v){if(Math.abs(v)>=9000)return v>0?'M':'-M';return (v/100>0?'+':'')+(v/100).toFixed(1)}
function pickG(id){gi=DATA.games.findIndex(g=>g.id===id);ply=DATA.games[gi].book;tab=sec(DATA.games[gi]);nav();render()}

function checkHTML(){const rows=DATA.rows;const gm=Object.fromEntries(DATA.games.map(g=>[g.fam,g.id]));
 const mk=r=>'<tr><td>'+r.k+'</td><td class="n">'+r.g+'</td><td class="n">'+r.W+'-'+r.D+'-'+r.L+'</td><td><span class="bt"><i style="width:'+r.sc+'%;background:'+(r.sc>=60?'var(--good)':r.sc>=50?'var(--warn)':'var(--bad)')+'"></i></span>'+r.sc+' %</td><td class="n">'+r.aol+'</td><td class="n">'+r.aml+'</td><td>'+(gm[r.k]?'<a class="go" onclick="pickG(\''+gm[r.k]+'\')">Musterpartie</a>':'')+'</td></tr>';
 const th='<tr><th>Eröffnung</th><th>Partien</th><th>S-R-N</th><th>Score</th><th>Verlust Eröffnung*</th><th>Verlust Mittelspiel*</th><th></th></tr>';
 return '<div class="card"><h2 style="margin-top:0">Stark (Score ≥ 60 %)</h2><table>'+th+rows.filter(r=>r.sc>=60).map(mk).join('')+'</table></div><div class="card"><h2 style="margin-top:0">Mittelfeld (50–59 %)</h2><table>'+th+rows.filter(r=>r.sc>=50&&r.sc<60).map(mk).join('')+'</table></div><div class="card"><h2 style="margin-top:0">Schwach (unter 50 %)</h2><table>'+th+rows.filter(r=>r.sc<50).map(mk).join('')+'</table></div><p class="note">*Durchschnittlicher Centipawn-Verlust pro eigenem Zug (Zug 1–10 bzw. 11–30, gedeckelt bei 1000). Nur Eröffnungsfamilien mit mindestens 12 Partien; „Weiß: Sizilianisch“ bedeutet z. B., dass du als Weiß gegen Sizilianisch gespielt hast. Score = (Siege + ½ Remis) / Partien.</p>'}
function gamesHTML(){const g=DATA.games[gi];const a=$('#app');const cats=[...new Set(DATA.games.filter(x=>sec(x)===tab).map(x=>x.cat))];
 let h=(tab==='turnier'&&DATA.tournament?standHTML():'')+(tab==='gotham'&&DATA.gothamOverview?'<div class="card"><h2 style="margin-top:0">GothamChess – Levy Rozman</h2><p>'+DATA.gothamOverview.text+'</p>'+(DATA.gothamOverview.source?'<p class="note">Quelle: '+DATA.gothamOverview.source.name+' · '+(DATA.gothamOverview.source.license_note||'')+'</p>':'')+'</div>':'')+(tab==='tal'&&DATA.talOverview?'<div class="card"><h2 style="margin-top:0">Michail Tal – der Zauberer aus Riga</h2><p>'+DATA.talOverview.text+'</p>'+(DATA.talOverview.source?'<p class="note">Quelle: '+DATA.talOverview.source.name+' · '+(DATA.talOverview.source.license_note||'')+'</p>':'')+'</div>':'');for(const c of cats){h+='<div class="note" style="margin-top:8px"><b>'+c+'</b></div><div class="list">'+DATA.games.filter(x=>x.cat===c).map(x=>'<button class="'+(x.id===g.id?'on':'')+'" onclick="pickG(\''+x.id+'\')">'+x.title+'</button>').join('')+'</div>'}
 h+='<div class="card"><h2 style="margin-top:0">'+g.title+'</h2><div class="note">'+(g.eng?g.eng:(g.user==='w'?'Du spielst Weiß':'Du spielst Schwarz'))+' · Ergebnis '+g.result+' ('+g.end+') · '+g.caps+' Schlagzüge · Theorie bis Zug '+Math.ceil(g.book/2)+'</div><div class="view"><div id="bd"></div><div><div id="mv" class="moves"></div><div class="ctrl"><button onclick="step(-999)">⏮</button><button onclick="step(-1)">◀</button><button id="pb" onclick="togglePlay()">▶ Abspielen</button><button onclick="step(1)">▶</button><button onclick="step(999)">⏭</button><button onclick="dl()">PGN laden</button></div><svg id="evg" class="evg" viewBox="0 0 600 110"></svg><div class="note" id="evn"></div></div></div></div>';
 h+='<div class="card">'+ideaHTML(g)+(g.stat?'<h3>Deine Daten</h3><p>'+g.stat.g+' Partien, '+g.stat.W+'-'+g.stat.D+'-'+g.stat.L+', Score '+g.stat.sc+' %, durchschnittlicher Verlust pro Zug: '+g.stat.aol+' cp in der Eröffnung, '+g.stat.aml+' cp im Mittelspiel.</p>':'')+'<h3>Wendepunkte der Engine-Partie</h3><p class="note">'+(g.key.length?g.key.map(k=>'<a class="go" onclick="jump('+k+')">Zug '+Math.ceil(k/2)+(k%2?'':'…')+' '+g.moves[k-1]+'</a>').join(' · '):'Keine größeren Bewertungssprünge: beide Seiten spielen praktisch fehlerfrei.')+'</p>'+hint(g)+'</div>'+kmHTML(g);
 a.innerHTML=h;draw()}
function draw(){const g=DATA.games[gi];const ft=ply>0?g.ft[ply-1]:null;$('#bd').innerHTML=board(g.fens[ply],g.user==='b',ft);
 let m='';g.moves.forEach((s,i)=>{if(i%2===0)m+='<span class="no">'+(i/2+1)+'.</span>';m+='<span class="m'+(i+1===ply?' cur':'')+(i<g.book?' bk':'')+'" onclick="jump('+(i+1)+')">'+s+'</span>'});$('#mv').innerHTML=m;const c=$('#mv .cur');if(c)c.scrollIntoView({block:'nearest'});
 const n=g.ev.length,pts=g.ev.map((v,i)=>(i/(n-1)*600).toFixed(1)+','+(55-Math.max(-300,Math.min(300,v))/300*50).toFixed(1)).join(' ');
 $('#evg').innerHTML='<rect width="600" height="55" fill="rgba(26,127,75,.12)"/><rect y="55" width="600" height="55" fill="rgba(192,57,43,.12)"/><polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="2"/><line x1="'+(ply/(n-1)*600)+'" x2="'+(ply/(n-1)*600)+'" y1="0" y2="110" stroke="var(--ink)" stroke-width="1.5"/>'+(g.book?'<line x1="'+(g.book/(n-1)*600)+'" x2="'+(g.book/(n-1)*600)+'" y1="0" y2="110" stroke="var(--mute)" stroke-dasharray="4 3"/>':'')+g.key.map(k=>'<circle cx="'+(k/(n-1)*600)+'" cy="'+(55-Math.max(-300,Math.min(300,g.ev[k]))/300*50)+'" r="4" fill="var(--warn)"/>').join('');

function puzHTML(){const T={mate:'Matt zugelassen',missed:'Gewinn verpasst',tact:'Mittelspiel-Patzer'};let h='';for(const t of ['mate','missed','tact']){h+='<h2>'+T[t]+'</h2><div class="pz">'+DATA.puz.filter(p=>p.type===t).map((p,i)=>{const id=t+i;return '<div class="card">'+board(p.fen,!p.w,null)+'<div style="margin-top:8px"><span class="tag">'+p.date+' · '+p.tc+' · '+p.color+' · Zug '+p.move+'</span></div><p style="margin:6px 0">Du hast <b class="bad">'+p.san+'</b> gespielt (Bewertung '+fmt(p.before)+' → '+(p.after==='Matt'?'Matt':fmt(p.after))+').</p><button onclick="document.getElementById(\''+id+'\').classList.toggle(\'on\')" style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer">Lösung zeigen</button><div class="sol" id="'+id+'">Besser war <b class="good">'+p.best+'</b>'+(p.pv.length>1?' (Variante: '+p.pv.join(' ')+')':'')+'.</div></div>'}).join('')+'</div>'}return '<p class="note">Positionen aus deinen eigenen Partien (Stockfish 19, Tiefe 11–13). Brett aus deiner Sicht, Figuren in Standardstellung; die Lösung ist zugeklappt.</p>'+h}
function rulesHTML(){return '<div class="card"><h2 style="margin-top:0">Mittelspiel-Regeln aus deinen Daten</h2><ol><li><b>Dame (30 % grobe Fehler oder Patzer pro Zug) und Turm (27 %):</b> Vor jedem Zug von Dame oder Turm prüfen, welche Schlagzüge und Schachs der Gegner danach hat.</li><li><b>Grundreihe:</b> 74-mal bist du per Grundreihenmatt verloren. Schaffe früh Luft (h3 oder g3) und lass nie den einzigen Turm von der Grundreihe weglocken.</li><li><b>Springer (25 %):</b> Nur auf gedeckte Felder ziehen und Gabeln auf König und Dame prüfen. Ungedeckte Figuren sind dein häufigster Verlustgrund.</li><li><b>Zug 11–30:</b> Hier liegt deine Fehlerquote bei 27–33 %. Formuliere in jeder Stellung einen Plan (Figur verbessern, Schwäche angreifen, König sichern), bevor du einen Zug wählst.</li><li><b>Vorteil verwerten:</b> Bei ≥ +3 tauschen, eigene Bauern sichern, erst dann Schach geben. 546-mal hast du Vorteil verspielt.</li><li><b>Dranbleiben:</b> Du rettest 41 % verlorener Stellungen. Gib nie auf, spiele aber ruhige, taktisch saubere Züge.</li></ol></div><div class="card"><h3 style="margin-top:0">Checkliste vor jedem Zug (10 Sekunden)</h3><p><b>1.</b> Hat der Gegner Schach oder Matt? <b>2.</b> Welche meiner Figuren sind ungedeckt? <b>3.</b> Was droht der Gegner nach meinem Zug? <b>4.</b> Gibt es für mich Schach, Schlagzug oder Matt in 1–3?</p></div>'}
function standHTML(){const T=DATA.tournament;return '<div class="card"><h2 style="margin-top:0">Computer-Championship</h2><p class="note">Jeder gegen jeden, eine Partie pro Paarung (Farbe wechselt), 0,6 s pro Zug auf einem 2-Kern-Laptop, Maia mit 1 Knoten. Eröffnungen aus deinem Repertoire. Siege 1 Punkt, Remis ½.</p><table><tr><th>#</th><th>Engine</th><th>Pkt</th><th>Partien</th><th>S-R-N</th></tr>'+T.map((t,i)=>'<tr><td class="n">'+(i+1)+'</td><td>'+t.name+(t.tb?' <span class="tag">'+t.tb+'</span>':'')+'</td><td class="n"><b>'+t.pts+'</b></td><td class="n">'+t.g+'</td><td class="n">'+t.W+'-'+t.D+'-'+t.L+'</td></tr>').join('')+'</table>'+(DATA.tournamentNote?'<p><b>'+DATA.tournamentNote+'</b></p>':'')+'<p class="note">Wähle unten eine Partie und spiele sie mit den Pfeiltasten nach.</p></div>'}
function mkPgn(g){const N=String.fromCharCode(10);const w=g.eng?g.eng.split(' · ')[0].slice(6):'Stockfish 19';const b=g.eng?g.eng.split(' · ')[1].slice(9):'Stockfish 19';let s='[Event "'+g.cat+'"]'+N+'[Site "lokal"]'+N+'[White "'+w+'"]'+N+'[Black "'+b+'"]'+N+'[Result "'+g.result+'"]'+N+'[Opening "'+g.title+'"]'+N+N;g.moves.forEach((m,i)=>{if(i%2===0)s+=(i/2+1)+'. ';s+=m+' {[%eval '+(g.ev[i+1]/100).toFixed(2)+']} '});return s.trim()+' '+g.result+N}
function hint(g){if(isSt(g))return '<p class="note">Stockfish-Bewertungen. Musterpartien: Stockfish 19 gegen sich selbst (0,8 s pro Zug); deine eigene Partie: Tiefe 16.</p>';if(isCl(g))return '<p class="note">Die Züge von Claude wurden ohne Engine-Hilfe aus eigener Rechnung gewählt. Stockfish 19 spielte begrenzt auf 1500 Elo (0,5 s pro Zug); die Bewertung (Tiefe 16) kam erst nach der Partie.</p>';if(isGo(g))return '<p class="note">Engine-Bewertungen: Stockfish 19 (Tiefe 14, flach: einzelne Werte können schwanken). Gegner anonymisiert, nur zum privaten Lernen.</p>';if(isTal(g))return '<p class="note">Engine-Bewertungen: Stockfish 19. Tals Opfer sind laut Engine nicht immer korrekt, aber praktisch stark: Das gehört zur Lehre dieser Partien.</p>';if(g.eng)return '<p class="note">Hinweis: Engine-Duell (Stockfish 19 nativ gegen Lc0 bzw. Berserk, 2 s pro Zug auf einem 2-Kern-Laptop). Lc0 lief mit einem kleinen Netz auf der CPU und ist hier deutlich schwächer als in Turnieren.</p>';return '<p class="note">Hinweis: Stockfish gegen Stockfish endet fast immer remis. Wichtig sind der Aufbau, die Pläne und die Reaktion auf typische Ideen, nicht das Ergebnis.</p>'}

 let h='<p class="note">Alle Stellungen sind mit Stockfish 19 (Tiefe 20–22) geprüft. Suche zuerst selbst, dann klicke auf „Lösung zeigen“.</p>';
 h+='<h2>Die wichtigsten Mattbilder ('+L.pat.length+')</h2><div class="pz">'+L.pat.map((p,i)=>card(p,i,'mp')).join('')+'</div>';
 h+='<h2>Taktik-Grundmuster ('+L.tac.length+')</h2><div class="pz">'+L.tac.map((p,i)=>card(p,i,'tp')).join('')+'</div>';
 h+='<h2>So hast du selbst gematt</h2><p class="note">Echte Stellungen aus deinen Partien (Zug vor dem Matt).</p><div class="pz">'+L.done.map((p,i)=>{const id='dn'+i;return '<div class="card">'+board(p.fen,!p.w,null)+'<h3>'+p.type+'</h3><p class="note">'+p.date+' · '+p.tc+' · Zug '+p.move+'</p><button class="sb" onclick="tg('+Q+id+Q+')">Lösung zeigen</button><div class="sol" id="'+id+'">Du hast <b class="good">'+p.san+'</b> gespielt: Matt.</div></div>'}).join('')+'</div>';
 h+='<h2>Verpasste Mattkombinationen aus deinen Partien</h2><p class="note">Hier gab es ein erzwungenes Matt in 2–4 Zügen (Engine-bestätigt), du hast etwas anderes gespielt.</p><div class="pz">'+L.missed.map((p,i)=>{const id='ms'+i;return '<div class="card">'+board(p.fen,!p.w,null)+'<h3>Matt in '+p.matein+'</h3><p class="note">'+p.date+' · '+p.tc+' · Zug '+p.move+' · du spieltest <b class="bad">'+p.played+'</b></p><button class="sb" onclick="tg('+Q+id+Q+')">Lösung zeigen</button><div class="sol" id="'+id+'"><b class="good">'+p.pv.join(' ')+'</b></div></div>'}).join('')+'</div>';
 return h}
function konterHTML(){const K=KON;const fm2=v=>Math.abs(v)>=9000?(v>0?'Matt für dich':'Matt gegen dich'):fmt(v);
 let h='<div class="card"><h2 style="margin-top:0">Dein Konter-Profil</h2><p>Du spielst Gegenangriff: Du lässt den Gegner kommen, hältst dagegen und suchst Schach, Schlagzüge und Drohungen. Das sagen deine Zahlen (1048 Partien):</p><table><tr><td>Partien, in denen du irgendwann −3 oder schlechter standest</td><td class="num">758</td></tr><tr><td class="good">davon gewonnen</td><td class="num">292 (39 %)</td></tr><tr><td class="warn">davon Remis</td><td class="num">20</td></tr><tr><td>Gerettet nach Farbe: Weiß / Schwarz</td><td class="num">168 von 379 / 146 von 379</td></tr><tr><td>Gerettet nach Zeit: Bullet / Blitz</td><td class="num">130 von 269 / 184 von 489</td></tr><tr><td>Rettungssiege mit Gegnerpatzer &gt; 5 Bauern</td><td class="num">246 von 292</td></tr><tr><td>„Einziger Zug“-Momente (aus 260 geprüften Stellungen)</td><td class="num">'+K.total+'</td></tr></table><p class="note">Der Gegner bricht unter Dauerdrohungen oft zusammen. Das funktioniert auf deinem Niveau; gegen sehr starke Spieler halten Konter nur, wenn jede Drohung konkret ist.</p></div>';
 h+='<div class="card"><h3 style="margin-top:0">Deine Konter-Eröffnungen</h3><table><tr><th>Eröffnung</th><th>Partien</th><th>S-R-N</th><th>Score</th></tr>'+K.rows.map(r=>'<tr><td>'+r.k+'</td><td class="n">'+r.g+'</td><td class="n">'+r.W+'-'+r.D+'-'+r.L+'</td><td class="n">'+r.sc+' %</td></tr>').join('')+'</table></div>';
 h+='<h2>Einziger Zug: Du hast den Konter gefunden</h2><p class="note">Echte Stellungen aus deinen Partien: Du standest schlechter, hast aber mit Schlag oder Schach den einzigen Zug gespielt (Stockfish mit zwei Varianten, Tiefe 14: der zweitbeste Zug ist deutlich schlechter).</p><div class="pz">'+K.only.map((p,i)=>{const id='ko'+i;return '<div class="card">'+board(p.fen,!p.w,null)+'<h3>Du standest schlechter ('+fmt(p.before)+')</h3><p class="note">'+p.date+' · '+p.tc+' · Zug '+p.move+'</p><button class="sb" onclick="tg('+Q+id+Q+')">Lösung zeigen</button><div class="sol" id="'+id+'">Du hast <b class="good">'+p.san+'</b> gespielt. Zweitbester Zug: '+p.second+' ('+fm2(p.secondCp)+').'+(p.pv&&p.pv.length>1?' <span class="note">Variante: '+p.pv.join(' ')+'</span>':'')+'</div></div>'}).join('')+'</div>';
 h+='<h2>Konterschläge in deinen Eröffnungen</h2><p class="note">Stockfish 19 (Tiefe 18, die zwei besten Züge). Die klassische Idee ist der Schlag gegen das Zentrum; die Engine bewertet oft mehrere Wege fast gleich.</p><div class="pz">'+K.open.map((p,i)=>{const id='kp'+i;return '<div class="card">'+board(p.fen,!p.w,null)+'<h3>'+p.name+'</h3><p class="note">'+(p.w?'Weiß':'Schwarz')+' am Zug</p><p>'+p.txt+'</p><button class="sb" onclick="tg('+Q+id+Q+')">Stockfish zeigen</button><div class="sol" id="'+id+'">Bester Zug: <b class="good">'+p.best+'</b> ('+(p.cp>0?'+':'')+(p.cp/100).toFixed(2)+')'+(p.alt?' · Alternative: <b>'+p.alt+'</b> ('+(p.altCp>0?'+':'')+(p.altCp/100).toFixed(2)+')':'')+'<br><span class="note">Variante: '+p.pv.join(' ')+'</span></div></div>'}).join('')+'</div>';
 h+='<div class="card"><h3 style="margin-top:0">Konter-Regeln</h3><ol><li><b>Erst die Drohung des Gegners verstehen</b>, dann prüfen, ob ein Schach, Schlag oder Matt-Angebot von dir stärker ist (Gegenschlag statt Verteidigung).</li><li><b>Konkrete Folgedrohung:</b> Ein Opfer braucht ein klares Ziel (Mattfeld, Dame, Läufer); sonst ist es nur Materialverlust.</li><li><b>Den Verteidiger ablenken:</b> Zuerst die Figur wegziehen, die das Matt verhindert (wie bei 22.Rxc7 mit Tempo auf die Dame).</li><li><b>Zeit mitspielen:</b> Im Bullet und Blitz zählt jede Drohung doppelt, weil der Gegner Zeit zum Rechnen braucht.</li><li><b>Nicht zu früh abbrechen:</b> Du rettest 40 % verlorener Stellungen, aber nur, wenn du nach dem Konter ruhig die Drohungen nachlegst.</li></ol></div>';
 return h}
